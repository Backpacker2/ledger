[package]
name = "ledger"
version = "0.1.0"
description = "Local-first ledger of threads, documents, user stories and a planboard"
authors = ["Milan Molenbrugge"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
serde_yaml_ng = "0.10.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha1 = "0.11.0"
ignore = "0.4.34"
tauri-plugin-dialog = "2.8.4"
base64 = "0.23.1"
tauri-plugin-global-shortcut = "2.4.1"
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screenshot", "global_shortcuts"] }
futures-util = "0.3.34"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
